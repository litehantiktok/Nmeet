<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#111318"
  >

  <title>VMeet - Họp trực tuyến</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- ========================= -->
  <!-- HOME -->
  <!-- ========================= -->

  <main id="home" class="home">

    <div class="logo">
      <div class="logo-icon">V</div>
      <h1>VMeet</h1>
    </div>

    <p class="subtitle">
      Họp trực tuyến đơn giản
    </p>

    <input
      id="name"
      type="text"
      placeholder="Nhập tên của bạn"
      maxlength="40"
      autocomplete="name"
    >

    <button
      id="create"
      class="primary-btn"
    >
      ➕ Tạo cuộc họp mới
    </button>

    <div
      id="joinInfo"
      class="join-info hidden"
    >
      Bạn được mời tham gia cuộc họp
    </div>

    <button
      id="join"
      class="primary-btn hidden"
    >
      🚪 Tham gia cuộc họp
    </button>

    <div
      id="connectionStatus"
      class="connection-status"
    >
      Đang kết nối...
    </div>

  </main>


  <!-- ========================= -->
  <!-- PREJOIN -->
  <!-- ========================= -->

  <main
    id="prejoin"
    class="prejoin hidden"
  >

    <div class="prejoin-card">

      <div class="prejoin-title">

        <div>
          <strong>Tham gia VMeet</strong>
          <span id="prejoinRoom">
            Kiểm tra thiết bị
          </span>
        </div>

      </div>

      <div class="preview-video">

        <video
          id="previewVideo"
          autoplay
          muted
          playsinline
        ></video>

        <div
          id="previewCameraOff"
          class="preview-off hidden"
        >
          <div class="off-icon">📷</div>
          <span>Camera đang tắt</span>
        </div>

        <div class="preview-name">
          <span id="previewName">
            Bạn
          </span>
        </div>

      </div>

      <div class="preview-controls">

        <button
          id="previewMic"
          class="preview-control active"
          type="button"
        >
          🎤
          <span>Mic</span>
        </button>

        <button
          id="previewCam"
          class="preview-control active"
          type="button"
        >
          📷
          <span>Camera</span>
        </button>

      </div>

      <button
        id="enterMeeting"
        class="enter-btn"
        type="button"
      >
        🚪 Vào cuộc họp
      </button>

      <button
        id="cancelPrejoin"
        class="cancel-btn"
        type="button"
      >
        Quay lại
      </button>

    </div>

  </main>


  <!-- ========================= -->
  <!-- MEETING -->
  <!-- ========================= -->

  <main
    id="meeting"
    class="meeting hidden"
  >

    <header class="meeting-header">

      <div class="header-info">

        <strong>VMeet</strong>

        <span id="roomTitle">
          Phòng
        </span>

      </div>

      <div class="header-actions">

        <button
          id="copy"
          class="header-btn"
          type="button"
          title="Mời người tham gia"
        >
          🔗
        </button>

        <button
          id="participantsBtn"
          class="header-btn"
          type="button"
          title="Người tham gia"
        >
          👥
        </button>

      </div>

    </header>


    <!-- ================= VIDEOS ================= -->

    <section
      id="videos"
      class="videos"
    >

      <div
        id="localTile"
        class="video-tile local-tile"
        data-user-id=""
      >

        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <div
          id="localCameraOff"
          class="camera-off-overlay hidden"
        >
          <div>📷</div>
          <span>Camera đang tắt</span>
        </div>

        <div class="video-name">

          <span id="localName">
            Bạn
          </span>

          <span
            id="localHostBadge"
            class="host-badge hidden"
          >
            👑
          </span>

        </div>

        <div
          id="localPinnedBadge"
          class="pinned-badge hidden"
        >
          📌 已 ghim
        </div>

      </div>

    </section>


    <!-- ================= CHAT ================= -->

    <section
      id="chatPanel"
      class="chat-panel hidden"
    >

      <div class="chat-header">

        <strong>
          💬 Trò chuyện
        </strong>

        <button
          id="closeChat"
          class="close-btn"
          type="button"
        >
          ✕
        </button>

      </div>

      <div
        id="messages"
        class="messages"
      ></div>

      <form
        id="chatForm"
        class="chat-form"
      >

        <input
          id="chatInput"
          type="text"
          maxlength="500"
          placeholder="Nhập tin nhắn..."
          autocomplete="off"
        >

        <button
          type="submit"
          class="send-btn"
        >
          Gửi
        </button>

      </form>

    </section>


    <!-- ================= PARTICIPANTS ================= -->

    <section
      id="participantsPanel"
      class="participants-panel hidden"
    >

      <div class="panel-header">

        <strong>
          👥 Người tham gia
        </strong>

        <button
          id="closeParticipants"
          class="close-btn"
          type="button"
        >
          ✕
        </button>

      </div>

      <div
        id="hostControls"
        class="host-controls hidden"
      >

        <div class="host-title">
          👑 Điều khiển chủ phòng
        </div>

        <button
          id="pinHost"
          class="host-action"
          type="button"
        >
          📌 Ghim chủ phòng
        </button>

        <button
          id="muteAll"
          class="host-action"
          type="button"
        >
          🔇 Tắt mic tất cả
        </button>

        <button
          id="cameraOffAll"
          class="host-action"
          type="button"
        >
          📷 Tắt camera tất cả
        </button>

        <button
          id="unlockAllMic"
          class="host-action"
          type="button"
        >
          🎤 Cho phép bật mic
        </button>

        <button
          id="unlockAllCamera"
          class="host-action"
          type="button"
        >
          📷 Cho phép bật camera
        </button>

        <button
          id="lockRoom"
          class="host-action"
          type="button"
        >
          🔒 Khóa phòng
        </button>

      </div>

      <div class="participants-content">

        <div class="list-title">
          Trong phòng
        </div>

        <div
          id="participantsList"
          class="participants-list"
        ></div>

      </div>

    </section>


    <!-- ================= CONTROLS ================= -->

    <nav class="controls">

      <button
        id="mic"
        class="control-btn"
        type="button"
      >
        <span class="icon">🎤</span>
        <span>Mic</span>
      </button>

      <button
        id="cam"
        class="control-btn"
        type="button"
      >
        <span class="icon">📷</span>
        <span>Camera</span>
      </button>

      <button
        id="switchCamera"
        class="control-btn"
        type="button"
      >
        <span class="icon">🔄</span>
        <span>Đổi cam</span>
      </button>

      <button
        id="screen"
        class="control-btn"
        type="button"
      >
        <span class="icon">🖥️</span>
        <span>Chia sẻ</span>
      </button>

      <button
        id="chatBtn"
        class="control-btn"
        type="button"
      >
        <span class="icon">💬</span>
        <span>Chat</span>
      </button>

      <button
        id="leave"
        class="control-btn leave-btn"
        type="button"
      >
        <span class="icon">📞</span>
        <span>Rời phòng</span>
      </button>

    </nav>

  </main>


  <!-- ================= TOAST ================= -->

  <div
    id="toast"
    class="toast hidden"
  ></div>


  <!-- Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- App -->
  <script src="/app.js"></script>

</body>
</html>
